[package]
name = "spotifast-engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "Motor de reproducción de Spotifast Mobile: librespot + puente JNI con protocolo estilo Soloist"

[lib]
name = "spotifast"
crate-type = ["cdylib"]

[dependencies]
# Sin features por defecto: nada de rodio/cpal ni OpenSSL. El audio sale por JNI a AudioTrack
# y el TLS es rustls (independiente de la versión de Android).
librespot-core = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-connect = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-discovery = { version = "0.8.0", default-features = false, features = ["with-libmdns", "rustls-tls-webpki-roots"] }
librespot-metadata = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false }
libc = "0.2"
http = "1"
bytes = "1"
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
jni = "0.21"
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[profile.release]
opt-level = 3        # menos CPU por segundo de audio decodificado = menos batería
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# librespot-core parcheado (ver vendor/librespot-core/src/config.rs, "SPOTIFAST PATCH").
[patch.crates-io]
librespot-core = { path = "vendor/librespot-core" }
