plugins {
    id "com.android.application"
}

// ---- Versión ---------------------------------------------------------------------------------
// El release la toma del tag (v0.6.0 → -PappVersion=0.6.0). versionCode = mayor*10000 + menor*100 + parche,
// así cada versión es mayor que la anterior y Android acepta instalarla encima.
def appVersion = (project.findProperty("appVersion") ?: "0.6.0").toString()
def appVersionCode = { String v ->
    def p = v.tokenize("-")[0].tokenize(".").collect { it.toInteger() } + [0, 0, 0]
    p[0] * 10000 + p[1] * 100 + p[2]
}

// ---- Firma -----------------------------------------------------------------------------------
// Con keystore propio (variables de entorno, ver README → "Release") el APK siempre tiene la misma
// firma y las actualizaciones se instalan encima. Sin keystore se usa la clave de debug de la
// máquina: sirve para probar, pero cada máquina firma distinto.
def keystorePath = System.getenv("SPOTIFAST_KEYSTORE")
def hasReleaseKey = keystorePath != null && file(keystorePath).exists()

android {
    namespace "app.tinyl"
    compileSdk 35

    defaultConfig {
        applicationId "app.tinyl"
        // Android 4.4 KitKat (2013). Los íconos vectoriales se convierten a PNG al compilar.
        minSdk 19
        targetSdk 35
        versionCode appVersionCode(appVersion)
        versionName appVersion
        // Solo español/inglés: menos recursos dentro del APK.
        resourceConfigurations += ["es", "en"]
    }

    // NDK r25: el último que puede generar binarios para Android 4.4 (API 19).
    ndkVersion "25.2.9519653"

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("SPOTIFAST_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SPOTIFAST_KEY_ALIAS")
                keyPassword System.getenv("SPOTIFAST_KEY_PASSWORD") ?: System.getenv("SPOTIFAST_KEYSTORE_PASSWORD")
                // v1 (JAR) para Android 4.4–6, v2 para 7+.
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }

    // Un APK por arquitectura: cada teléfono baja solo su motor nativo (~3 MB en vez de ~9 MB).
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
            universalApk true
        }
    }
}

// ---- Motor nativo (Rust + librespot) ------------------------------------------------------
// Compila native/ con cargo-ndk y deja libtinyl.so en src/main/jniLibs.
// Saltear con -PskipRust si las .so ya están compiladas (p. ej. en un paso previo de CI).
// Los ABIs de 32 bits se compilan para API 19 (Android 4.4); los de 64 bits empiezan en API 21.
// x86 cubre teléfonos Intel Atom de la época de KitKat (p. ej. ASUS Zenfone 4/5).
def ndkDir = android.ndkDirectory
def jniOut = file("src/main/jniLibs").absolutePath
def cargoNdk = { List<String> abis, String api ->
    def cmd = ["cargo", "ndk"]
    abis.each { cmd += ["-t", it] }
    cmd + ["-P", api, "-o", jniOut, "build", "--release"]
}
tasks.register("cargoBuild32", Exec) {
    workingDir rootProject.file("native")
    environment "ANDROID_NDK_HOME", ndkDir.absolutePath
    commandLine cargoNdk(["armeabi-v7a", "x86"], "19")
    onlyIf { !project.hasProperty("skipRust") }
}
tasks.register("cargoBuild", Exec) {
    group = "build"
    description = "Compila el motor librespot para Android"
    dependsOn "cargoBuild32"
    workingDir rootProject.file("native")
    environment "ANDROID_NDK_HOME", ndkDir.absolutePath
    commandLine cargoNdk(["arm64-v8a", "x86_64"], "21")
    onlyIf { !project.hasProperty("skipRust") }
}
tasks.named("preBuild") { dependsOn "cargoBuild" }

dependencies {
    // OkHttp 3.12.x: última rama compatible con Android viejo y sin Kotlin stdlib (APK chico).
    implementation "com.squareup.okhttp3:okhttp:3.12.13"
}
